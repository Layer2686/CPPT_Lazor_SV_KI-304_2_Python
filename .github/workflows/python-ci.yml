name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version

      - name: Test, lint and build each lab
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($lab in @('LAB_06', 'LAB_07')) {
            if (!(Test-Path "$lab/pyproject.toml")) {
              continue
            }

            Push-Location $lab
            try {
              python -m venv .venv
              $devPython = if ($IsWindows) { '.venv/Scripts/python.exe' } else { '.venv/bin/python' }
              & $devPython -m pip install -e '.[dev]'
              & $devPython -m pytest
              & $devPython -m ruff check .
              & $devPython -m ruff format --check .
              & $devPython -m build
              python ../.github/scripts/check_wheel.py
            } finally {
              Pop-Location
            }
          }

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ runner.os }}
          path: |
            LAB_06/dist/*.whl
            LAB_07/dist/*.whl
          if-no-files-found: error
